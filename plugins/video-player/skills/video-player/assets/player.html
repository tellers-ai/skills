<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tellers Player</title>
    <style>
      html, body { height: 100%; margin: 0; background: #08090b; color: #f4f6f8; font: 13px system-ui, sans-serif; }
      #player { height: 100%; min-height: 0; }
      #timeline { display: none; min-height: 0; border-top: 1px solid #1d1f22; }
      body.with-timeline { display: grid; grid-template-rows: minmax(0, 1fr) minmax(240px, 42%); }
      body.with-timeline #timeline { display: block; }
      .error { padding: 24px; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <div id="timeline"></div>

    <!--
      The Tellers player, one self-contained file (workers and codecs inlined),
      loaded from the tellers-player Vercel project. It brings its own play / seek / export controls.
      Query parameters:
        ?otio=<url>      timeline to play (default: timeline.otio next to this page)
        ?title=<text>    title shown over the picture
        ?timeline=1      show the editor timeline under the player; every edit is saved
                         to exports/<otio file name> (serve.py), never over the original
        ?timeline=view   the timeline without editing (seek, zoom, select)
        ?src=<url>       load bundle.js from elsewhere (a local or test build)
    -->
    <script>
      const PLAYER_URL = "https://tellers.ai/videoplayer/bundle.js";
      const params = new URLSearchParams(location.search);
      const otioUrl = params.get("otio") || "timeline.otio";
      const timelineMode = params.get("timeline");
      const container = document.getElementById("player");
      const fail = (html) => { container.innerHTML = `<p class="error">${html}</p>`; };

      // POST a file to serve.py, which writes it to exports/<name>.
      const saveToFolder = async (name, blob) => {
        const response = await fetch(`/exports/${encodeURIComponent(name)}`, { method: "POST", body: blob });
        if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
        return response.json();
      };

      // Edits made in the timeline: the latest one is saved (debounced) to exports/<otio name>.
      // window.timelineStatus is { edits, state: "saving" | "saved" | "error", path, error }.
      const editedName = (otioUrl.split(/[?#]/)[0].split("/").pop() || "timeline.otio").replace(/\.(otio|json)$/i, "") + ".otio";
      let saveTimer = null;
      const saveEdit = (otio) => {
        const status = window.timelineStatus;
        status.edits += 1;
        status.state = "saving";
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          try {
            const blob = new Blob([JSON.stringify(otio, null, 2)], { type: "application/json" });
            Object.assign(status, { state: "saved", error: undefined }, await saveToFolder(editedName, blob));
          } catch (error) {
            Object.assign(status, { state: "error", error: String(error.message || error) });
          }
        }, 500);
      };

      if (location.protocol === "file:") {
        fail("Open this page through a local server, not as a file: " +
          "<code>python3 serve.py .</code> then <code>http://localhost:8000/player.html</code>.");
      } else {
        const script = document.createElement("script");
        script.src = params.get("src") || PLAYER_URL;
        script.onload = async () => {
          window.ui = TellersPlayerUI.mount(container, {
            otioUrl,
            title: params.get("title") || undefined,
            tellersLink: { variant: "powered" },
            export: { format: "mp4", resolution: 1080, save: "picker" },
          });
          if (timelineMode && timelineMode !== "0") {
            document.body.classList.add("with-timeline");
            window.timelineStatus = { edits: 0, state: "unchanged", path: `exports/${editedName}` };
            window.timeline = await TellersPlayerUI.mountTimeline(document.getElementById("timeline"), {
              player: window.ui,
              editable: timelineMode !== "view",
              onChange: saveEdit,
            });
          }
        };
        // Render with the player and save into the served folder (serve.py writes exports/<name>).
        // Progress and the result are kept in window.exportStatus, so a caller can poll it.
        window.exportToFolder = async (name = "export.mp4", options = {}) => {
          const status = window.exportStatus = { state: "exporting", progress: 0, name };
          try {
            const format = options.format || name.split(".").pop().replace("jpg", "jpeg");
            const result = await window.ui.export({
              ...options,
              format,
              save: "none",
              onProgress: (fraction, phase) => { status.progress = fraction; status.phase = phase; },
            });
            if (result.cancelled || !result.url) return Object.assign(status, { state: "cancelled" });
            status.state = "saving";
            const blob = await (await fetch(result.url)).blob();
            return Object.assign(status, { state: "done", progress: 1 }, await saveToFolder(name, blob));
          } catch (error) {
            return Object.assign(status, { state: "error", error: String(error.message || error) });
          }
        };
        script.onerror = () => fail(`Could not load the player from <code>${script.src}</code>. Check the internet connection.`);
        document.head.appendChild(script);
      }
    </script>
  </body>
</html>
